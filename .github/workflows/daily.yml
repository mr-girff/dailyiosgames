name: Daily Game Data
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - run: npm install --no-audit --no-fund

      - name: Fetch
        run: npm run fetch

      - name: Enrich
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
        run: npm run enrich

      - name: Sanity check (guard against empty/broken data)
        run: |
          node -e '
            const fs = require("fs");
            const MIN = 50; // active set has been ~130; 50 = generous floor
            const d = JSON.parse(fs.readFileSync("data/enriched.json", "utf8"));
            const all = d.all || [];
            const n = all.length;
            // `all` is now the persistent catalogue (every game ever seen), so the
            // floor has to be checked against the games seen in TODAY's snapshot.
            const active = all.filter(g => g.active).length;
            const today = new Date().toISOString().slice(0,10);
            if (active < MIN) {
              console.error(`SANITY FAIL: only ${active} active games today (< ${MIN}), catalogue ${n}. Aborting before commit to protect data + site.`);
              process.exit(1);
            }
            if (n < active) {
              console.error(`SANITY FAIL: catalogue (${n}) smaller than today's active set (${active}) — catalogue regression.`);
              process.exit(1);
            }
            const snap = `data/${today}.json`;
            if (!fs.existsSync(snap)) {
              console.error(`SANITY FAIL: today snapshot ${snap} missing. Fetch likely failed.`);
              process.exit(1);
            }
            console.log(`Sanity OK: ${n} games enriched, snapshot ${snap} present.`);
          '

      - name: Velocity (heat signals from snapshot history)
        run: npm run velocity

      - name: Trends
        run: npm run trends
        continue-on-error: true   # Google Trends frequently blocks cloud IPs; non-fatal

      - name: Images (upload to R2)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
        run: npm run images

      # Social-share cards. SVG og:images are ignored by every major platform,
      # so the SVGs are rasterised to 1200x630 PNGs here (the runner has fonts).
      - name: Open Graph images
        run: npm run og

      # Teaser videos are disabled: the last runs produced nothing (0 games in
      # enriched.json carry a video), the README documents them as useless, and
      # each run added ~1 MB/day of committed MP4s. Re-enable by restoring this
      # step plus the ffmpeg/edge-tts apt install above.
      # - name: Video teasers
      #   run: npm run video
      #   continue-on-error: true

      - name: Sync reader reviews
        env:
          PUBLIC_REVIEWS_WORKER: ${{ vars.PUBLIC_REVIEWS_WORKER }}
        run: npm run reviews

      # Slims snapshots older than 60 days down to the fields velocity.mjs needs.
      # Without this, data/ grows ~140 MB/year of git objects.
      - name: Compact old snapshots
        run: npm run compact

      - name: Verify the site still builds from the new data
        run: npm run verify

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ public/*.png public/illus/*.png src/content/posts/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: daily refresh $(date -u +%F)"
          # Retry with rebase to survive concurrent pushes
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "Push attempt $i failed; retrying in 5s..."
            sleep 5
          done
          echo "All push attempts failed."
          exit 1
