name: Build & integrity check

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - run: npm install --no-audit --no-fund

      # Same command Cloudflare Pages runs, so a broken build can never reach
      # production unnoticed.
      - name: Build
        run: npm run build

      # Fails on broken internal links, sitemap/route drift and missing
      # canonicals — the failure modes this site actually shipped before.
      - name: Integrity check
        run: npm run check
